version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # 这一节里有**两组必须成对动的**，Dependabot 一律当独立 PR 提，不能逐个合：
    #
    # ── 一、langchain4j 的稳定线与 beta 线 ──────────────────────────────
    #
    #   #2  langchain4j               1.18.1 → 1.19.0
    #   #8  langchain4j.beta.version  1.18.1-beta28 → 1.20.0-beta30
    #
    # 两个都合会把两条线**错开**（稳定线停 1.19.0、beta 线到 1.20.0），
    # 而 core 与 starter/pgvector 必须同版。配对判据很明确：两边版本号里的数字相同。
    # 已按最新配对一起升到 `1.20.0` + `1.20.0-beta30`。下次再提时照同一条规矩配。
    #
    # ── 二、springdoc 与 Spring Boot 的大版本 ──────────────────────────
    #
    #   #17  springdoc-openapi 2.8.14 → 3.1.0
    #   #12  spring-boot-starter-parent 3.5.16 → 4.1.1
    #
    # 实测两个 springdoc 的 parent（repo1.maven.org 上的 pom）：
    #
    #     springdoc-openapi:2.8.14  →  parent 是 spring-boot-starter-parent:3.5.7
    #     springdoc-openapi:3.1.0   →  parent 是 spring-boot-starter-parent:4.1.0
    #
    # 也就是说 **springdoc 3.x 是面向 Spring Boot 4 编译的**。本仓库现在在 3.5.16 上，
    # 单独合 #17 会让 OpenAPI 那条链路整体不兼容。
    # 它和 #12 是同一件事的两半：**要么一起走 Boot 4 迁移，要么都别动。**
    # 迁移的价值见 README「依赖安全」——那里逐条算过，走 Boot 4 能清掉
    # 当前 16 条阻断漏洞里的 14 条。代价是 Jakarta EE 11 / Tomcat 11 / Jackson 3。

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # ⚠️ 已知不可合并的一个：`typescript` 6 → 7。
    #
    # 2026-09-19 实测过（装上再跑四项门禁），它会同时打红两个地方：
    #
    #   npm run lint   → Error: typescript-eslint does not support TS 7.0.
    #                    它的 peer 要求是 `typescript >=4.8.4 <6.1.0`
    #   npm run build  → ERR_PACKAGE_PATH_NOT_EXPORTED: Package subpath './lib/tsc'
    #                    is not defined by "exports"（vue-tsc 3.3.8 用不了 TS 7）
    #
    # （`npm test` 反而是绿的——vitest 不经过 tsc。只跑测试会以为可以合。）
    #
    # **这里故意不加 `ignore`**：一旦 typescript-eslint 与 vue-tsc 支持了 TS 7，
    # 就该让 Dependabot 照常提出来。加一条 ignore 等于把它变成一道
    # 「得有人记得拆掉」的墙，而没有人会记得。

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # 这里钉的版本是**按 `runs.using` 挑出来的「能跑在 node24 上的最低 major」**，
    # 不是随手取最新。2026-09-19 逐个大版本查过各自的 action.yml：
    #
    #   checkout         v4=node20  v6=node24  v7=node24
    #   setup-java       v4=node20  v5=node24  v6=node24
    #   setup-node       v4=node20  v5=node24  v7=node24
    #   upload-artifact  v4=node20  v5=node20  v6=node24  v7=node24
    #                                                       ↑ v5 仍然是 node20
    #   cache            v4=node20  v5=node24  v6=node24
    #
    # `upload-artifact@v5` 仍是 node20 这一点值得记：凭「v4 旧了那就升 v5」
    # 会升完发现告警还在。
    #
    # **Dependabot 现在提的下一跳（v5→v6、v6→v7…）不是必须的**：当前这几个
    # 已经跑在 node24 上，Node 20 的弃用告警已经消失；也逐个看过 release，
    # 这些新 major 的发布说明里没有安全条目——有安全字样的那几个版本
    # （cache v5.0.3/v5.0.4、upload-artifact v3.2.2）都**低于**当前用的版本，
    # 也就是说那些修复已经在里面了。
    #
    # 于是这 5 个 PR 会一直占着配额，直到有人决定升。**这是可接受的**：
    # 真正的安全网是仓库的 dependabot alerts 与 security updates 两个开关
    # （都已开），它们与这里的版本更新是相互独立的路径，
    # 不会因为配额被占满而失效。
