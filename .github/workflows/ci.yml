name: CI

permissions:
  contents: read

# 同一分支上的**推送**会互相取消：只有最新一次提交的结论有意义。
#
# 加这条的直接原因：连推三次之后，CI 里同时排着三个完整运行——每个都要跑一遍
# 30 分钟的依赖扫描、集成测试与 Playwright E2E，而前两次的结论在第三次推送后
# 已经没人会看了。纯文档提交也一样排队，那是白烧的额度与延迟。
#
# `github.event_name` 放进 group，是为了让**定时任务不被推送取消**：
# 它跑的是「与提交无关的外部变化」（镜像 tag、Flyway 迁移、外部依赖），
# 被一次推送取消等于把一个独立信号源关掉——而那恰恰是它存在的理由。
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
  pull_request:
  # 每日定时跑一遍完整链路。
  # 为什么需要它：push/PR 只在有人提交时才跑，而依赖服务、镜像 tag、
  # Flyway 迁移与外部数据的变化与提交无关——一次数周没人动的仓库，
  # 门禁可能早就红了却没人知道。定时任务是发现"沉默失效"的唯一办法。
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

jobs:
  # 后端质量门禁：格式、确定性单元测试、规则回归与高优先级静态分析
  unit-test:
    name: Backend Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Verify formatting, tests and static analysis
        run: cd backend && ./mvnw verify -Dgroups='!integration'
      - name: Upload backend coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco
          if-no-files-found: error
      # Surefire XML 单独传一份，给下面的 readme-numbers job 用：
      # README 那张测试表里的数字就是从这些 XML 读出来的，「文档说的」要能对着
      # 「真实产物」验，而不是对着另一个手抄的地方验。
      # 只传本 job 真实产出的那一份——集成回归的 XML 在 `integration-test` job 里，
      # 那份由它自己上传（这里带上会因找不到文件而 error）。
      - name: Upload backend surefire reports
        uses: actions/upload-artifact@v7
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/TEST-*.xml
          if-no-files-found: error

  # 敏感信息扫描：检查 API Key / 私钥 / 硬编码密钥是否意外提交
  security-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Scan for secrets
        run: |
          if grep -rInE \
            --exclude-dir=node_modules --exclude-dir=target --exclude-dir=.git \
            --exclude='*.lock' \
            "(sk-[A-Za-z0-9_-]{16,}|AKIA[0-9A-Z]{16}|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|api[_-]?key[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9_-]{16,})" \
            . ; then
            echo "::error::检测到疑似密钥/私钥泄露"
            exit 1
          fi
          echo "未检测到密钥/私钥泄露"

  # 前端：组件测试 + 类型检查 + 生产构建，避免提交破坏前端
  frontend-build:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Check formatting
        run: cd frontend && npm run format:check
      - name: Lint
        run: cd frontend && npm run lint
      - name: Run unit tests
        run: cd frontend && npm run test:coverage
      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-report
          path: frontend/coverage
          if-no-files-found: error
      # Vitest 的 JSON 产物，理由同上：README 的前端那一行是从它读出来的。
      # 注意要用 `test:json` 而不是 `test:coverage` 产的那个位置——
      # `.reports/vitest.json` 是 `test_summary.py` 写死要读的路径。
      - name: Produce machine-readable test report
        run: cd frontend && npm run test:json
      - name: Upload frontend vitest report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-vitest-report
          path: frontend/.reports/vitest.json
          if-no-files-found: error
      - name: Audit production dependencies
        run: cd frontend && npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - name: Build
        run: cd frontend && npm run build

  backend-dependency-scan:
    name: Backend Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # ── NVD 数据缓存 ──────────────────────────────────────────────
      #
      # 没有 NVD_API_KEY 时这个 job 实测跑 **22–26 分钟**（早先一次限流严重时到过
      # `Total time: 02:03 h`），时间几乎全花在下载与更新 NVD 的 CVE 库上。
      # 那份数据一天之内不会变，每个 commit 都从头下一遍是纯浪费。
      #
      # ⚠️ **取缓存（restore）与存缓存（save）必须拆成两步**，这是踩过之后改的：
      #
      # 原先只写了一个 `actions/cache@v4`。它的保存发生在**后置步骤**，而后置步骤
      # 默认只在前面所有步骤成功时才跑——可这个 job 恰恰是「扫到漏洞就 exit 1」，
      # 于是**缓存永远存不下来**：只有在扫描通过时才写入，而那正是不需要缓存的场合。
      # 实测证据：job 的步骤列表里 `Post Cache NVD data` 是 `completed/skipped`，
      # 仓库的缓存列表里也**根本没有 nvd-data-\* 条目**（13 条全是 setup-java 的）。
      #
      # 所以取用 `actions/cache/restore`，存在扫描之后单独一步、带 `if: always()`。
      #
      # `key` 按**天**算，不是按 run_id。
      #
      # 一开始用的是 `nvd-data-${{ github.run_id }}`（想法是"每次运行都写一份新的，
      # 免得固定 key 让数据停在过去"）。但那样**每次 CI 都新写一份 115 MB**——
      # 实测：一天 20 次 CI 之后仓库缓存已经到 **4081 MB / 10240 MB（39.9%）**，
      # 而里面 5 条 nvd-data 就占了 575 MB。再跑几天它就会把 setup-java / node
      # 那些真正让 CI 变快的缓存挤出去（LRU 淘汰是全局的）。
      #
      # NVD 数据一天只变一次，按天做 key 正好：当天第一次运行把它写下来，
      # 之后当天所有运行都命中同一份。老的那几份没人再读，会被 GitHub 的
      # 「7 天未被访问即回收」自然清掉，稳态大约 7 份 ≈ 800 MB。
      #
      # ⚠️ `dataDirectory` 在下一步里是**显式指定**的，与这里的 path 必须一致。
      # 不显式写的话它取 Maven 本地仓库下的插件默认位置——那样缓存路径就成了
      # 对第三方默认值的推断，插件升级改了默认值就会静默失配（缓存永远不命中，
      # 而没人会注意到）。显式写出来，两个路径才是同一件事。
      - name: Compute NVD cache key
        id: nvd-key
        run: echo "key=nvd-data-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore NVD data
        id: nvd-restore
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/dependency-check-data
          key: ${{ steps.nvd-key.outputs.key }}
          restore-keys: |
            nvd-data-
      # 扫描结果写到文件：失败时得能分清是"你的依赖有漏洞"还是"漏洞库没拉到"。
      #
      # 这个 job 原先一直是红的，而原因是后者——NVD 数据源在没有 API Key 时会被
      # 严格限流，dependency-check 拉不全数据就整体失败，报一堆
      # "Failed to process CVE-…"。看起来像发现了上百个漏洞，实际一个都没分析出来。
      # 两种原因都该让 job 红（门禁没生效本身就是问题），但必须能一眼分开。
      #
      # ⚠️ 分类逻辑在 `scripts/classify_dependency_scan.py`，**不要挪回 shell 里**。
      # 它原先就是一段内联 grep，模式里有个裸的 `429`（本意 HTTP 429 限流），
      # 结果匹配到 `[INFO] Completed processing batch 59/198 (30%) in 429ms`
      # ——一个处理耗时——于是 2026-09-18 那次「真扫出 CVSS 9.8 漏洞」
      # 被报成「只是限流，不是漏洞」，把安全门禁说成可以忽略。
      # 抽成脚本是为了让那次误判成为回归用例（`scripts/test_classify_dependency_scan.py`）。
      - name: Scan Maven dependencies
        id: scan
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          # 与上面 Cache NVD data 的 path 必须一致
          args=(-DfailBuildOnCVSS=7 "-DdataDirectory=$HOME/.m2/dependency-check-data")
          if [ -n "$NVD_API_KEY" ]; then
            args+=("-DnvdApiKey=$NVD_API_KEY")
          else
            echo "::warning::未配置 NVD_API_KEY：漏洞库有 39 万余条记录，匿名访问会被限流，本步很可能根本跑不成（这跟「扫出漏洞」是两回事）。密钥免费：https://nvd.nist.gov/developers/request-an-api-key"
          fi
          set +e
          ./mvnw org.owasp:dependency-check-maven:12.2.2:check "${args[@]}" 2>&1 | tee dependency-scan.log
          code=${PIPESTATUS[0]}
          set -e

          if [ "$code" -eq 0 ]; then
            echo "依赖扫描通过"
            # 数据是完整的，允许缓存（见下面 Save NVD data 的条件）
            echo "verdict=pass" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 分类并打印对应的 ::error:: 注解；无论哪种原因，job 都必须红。
          #
          # `--github-output` 让判定结果同时进本步骤的 outputs——保存缓存的步骤靠它
          # 区分「扫出漏洞」（数据可信，该存）与「压根没跑成」（数据不可信，不该存）。
          python3 ../scripts/classify_dependency_scan.py dependency-scan.log --github-output "$GITHUB_OUTPUT"
          exit 1
      # 存缓存必须单独一步，且 `if: always()`。
      #
      # 理由见上面 Restore NVD data 的注释：这个 job 恰恰是「扫到漏洞就失败」，
      # 而 `actions/cache` 的后置保存默认只在成功时执行——于是缓存永远存不下来。
      # 这里用 `if: always()` 覆盖掉那个默认。
      #
      # ⚠️ **但 `always()` 不等于"无条件存"**，这是踩过之后补的：
      #
      # 扫描因为数据源问题失败时，数据目录里是**没下完的**库，甚至残留着
      # `odc.update.lock`。无条件存下去，下一个运行恢复它会在同一个地方再失败一次
      # ——自己喂自己。实测过一次：job 日志里
      #     Lock file found `…/odc.update.lock`
      #     UpdateException: Unable to obtain an exclusive lock on the H2 database
      #     NoDataException: No documents exist
      # 而那一轮存下来的缓存只有 **23.2 MB**（正常是 114.9 MB）。
      # 运行被**并发取消**时也一样：扫描步骤没跑完，数据同样不可信。
      #
      # 所以加第二个条件：只有 `verdict` 是 `pass`（扫描通过）或 `findings`
      # （扫出漏洞，但**数据是好的**——漏洞判定本身可信）时才存。
      # 判定由 `scripts/classify_dependency_scan.py --github-output` 产出。
      # 取消掉的那次连 `verdict` 都写不出来，自然也落不到这两个值上。
      #
      # `cache-hit != 'true'` 是第三个条件：当天那份已存在就不写，
      # 因为 `actions/cache/save` 遇到**已存在**的 key 会直接失败，而那是预期内的。
      # `continue-on-error` 兜住同一天两个分支同时判定"当天不存在"、抢着写的竞态：
      # 缓存只是加速手段，写不进去不该让门禁变红。
      - name: Save NVD data
        if: >-
          always()
          && steps.nvd-restore.outputs.cache-hit != 'true'
          && (steps.scan.outputs.verdict == 'pass' || steps.scan.outputs.verdict == 'findings')
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ~/.m2/dependency-check-data
          key: ${{ steps.nvd-key.outputs.key }}
      - name: Upload dependency scan report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: dependency-scan-report
          path: |
            backend/dependency-scan.log
            backend/target/dependency-check-report.html
          if-no-files-found: warn

  # 辅助 Python 脚本：与主工程使用相同的 LF、120 列和静态检查基线
  python-quality:
    name: Python Script Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Ruff
        run: pip install -r requirements-dev.txt
      - name: Check formatting
        run: ruff format --check benchmark scripts
      - name: Lint
        run: ruff check benchmark scripts
      # 下面两步都先断言"发现了多少条测试"再跑。
      #
      # `unittest discover` 在**一条测试都没发现**时同样以 0 退出：改了测试文件命名、
      # 动了目录、包名写错，这一步就会绿着通过而**什么都没跑**。
      # "检查绿着、被检查的事没发生"——本仓库已经在这上面栽过两次，
      # 两次都记在 `scripts/test_classify_dependency_scan.py` 开头。
      - name: Run benchmark protocol tests
        run: |
          found=$(python -c "import unittest; print(unittest.defaultTestLoader.discover('benchmark', pattern='test_*.py').countTestCases())")
          [ "$found" -gt 0 ] || { echo "::error::benchmark 下一共发现 0 条测试——这一步什么都没跑，不能报通过"; exit 1; }
          echo "benchmark：发现 $found 条测试"
          python -m unittest discover -s benchmark -p 'test_*.py'
      - name: Run script unit tests
        # 依赖扫描的分类器在这里被测试。它曾经把「真发现漏洞」误报成
        # 「数据源挂了」，回归用例在 scripts/test_classify_dependency_scan.py。
        working-directory: scripts
        run: |
          found=$(python -c "import unittest; print(unittest.defaultTestLoader.discover('.', pattern='test_*.py').countTestCases())")
          [ "$found" -gt 0 ] || { echo "::error::scripts 下一共发现 0 条测试——这一步什么都没跑，不能报通过"; exit 1; }
          echo "scripts：发现 $found 条测试"
          python -m unittest discover -s . -p 'test_*.py'
      - name: Check repository text conventions
        run: python scripts/check_text_conventions.py

  # README 里那张「最近一次本机验证」表，数字是手抄的——2026-09-19 发现它写着
  # 「549/550」而真实值是 575/576，差了 26 项，是加测试时忘了改文档。
  #
  # 单独一个 job，因为三层数字来自三个不同的 job：后端单测在 `unit-test`、
  # 集成回归在 `integration-test`、前端在 `frontend-build`。放在其中任何一个里
  # 都只能看到三分之一——而**看不到的层会被跳过**，跳过就等于没检查。
  # 所以这里把三份产物都取回来再比。
  #
  # ⚠️ 脚本在「一层都没比对成」时会**报错退出**，不是静默通过：
  #    用空集证明合格，正是这类检查最常见的死法（本仓库已经栽过两次）。
  readme-numbers:
    name: README Test Numbers
    runs-on: ubuntu-latest
    needs: [unit-test, integration-test, frontend-build]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Download backend unit test reports
        uses: actions/download-artifact@v6
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports
      - name: Download backend integration test reports
        uses: actions/download-artifact@v6
        with:
          name: backend-integration-surefire-reports
          path: backend/target/surefire-reports-integration
      - name: Download frontend vitest report
        uses: actions/download-artifact@v6
        with:
          name: frontend-vitest-report
          path: frontend/.reports

      - name: README 的测试数字与实测一致
        run: python scripts/check_readme_test_numbers.py

  # 集成测试：每次变更都在隔离依赖服务上执行，防止迁移和适配器回归漏检
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123456
          MYSQL_DATABASE: aml_agent
          MYSQL_USER: aml
          MYSQL_PASSWORD: aml123456
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot123456"
          --health-interval 10s --health-timeout 5s --health-retries 5
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aml
          POSTGRES_PASSWORD: aml123456
          POSTGRES_DB: aml_rag
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aml -d aml_rag"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # 先把三个依赖逐个探一遍。它们没起来时的报错通常是一句连接超时或
      # Flyway 迁移失败，读的人还得自己推断是哪个依赖——这一步直接点名。
      - name: Check integration dependencies are reachable
        # 用 python3：这个 job 没有 setup-python，ubuntu runner 上只有 python3 一定存在
        run: python3 scripts/integration_report.py --preflight
      - name: Run integration tests
        run: cd backend && ./mvnw -Pintegration-test test
        env:
          AML_RAG_RERANK_ENABLED: 'false'
      # 失败时逐条列出失败的测试类，让 Actions 摘要能直接点到名字，
      # 而不是把一屏 Maven 输出丢给人翻
      - name: Summarize failed integration tests
        if: ${{ failure() }}
        run: python3 scripts/integration_report.py --failures
      # README 的集成回归那一行从这些 XML 读出，交给 readme-numbers job 比对
      - name: Upload integration surefire reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-integration-surefire-reports
          path: backend/target/surefire-reports-integration/TEST-*.xml
          if-no-files-found: warn

  # 端到端测试：后端 + 前端 + Playwright，验证核心用户流程
  e2e-test:
    name: Playwright E2E
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123456
          MYSQL_DATABASE: aml_agent
          MYSQL_USER: aml
          MYSQL_PASSWORD: aml123456
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot123456"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aml
          POSTGRES_PASSWORD: aml123456
          POSTGRES_DB: aml_rag
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aml -d aml_rag"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check integration dependencies are reachable
        run: python3 scripts/integration_report.py --preflight
      # 日志重定向到文件：后端起不来时，唯一能说明原因的东西就是它自己的输出。
      # 之前直接 & 起进程、日志混在 job 输出里，出了问题只能从头翻。
      - name: Start backend
        run: |
          cd backend
          nohup ./mvnw -B spring-boot:run > ../backend-e2e.log 2>&1 &
        env:
          SPRING_PROFILES_ACTIVE: test
          MYSQL_USER: aml
          MYSQL_PASSWORD: aml123456
          AML_RAG_RERANK_ENABLED: 'false'
          # 强制 Mock 模型：E2E 不能依赖外网，也不能依赖真实模型的随机性。
          # 本机若配了 DEEPSEEK_API_KEY，不显式指定就会真的去调外部模型——
          # 测试会变慢、变贵，而且终态不再确定。
          AML_LLM_ACTIVE_PROVIDER: mock
      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "后端已就绪"
              exit 0
            fi
            sleep 2
          done
          echo "::error::后端未在超时时间内就绪，后端日志尾部："
          tail -n 80 backend-e2e.log
          exit 1
      - name: Install frontend deps
        if: always()
        run: cd frontend && npm ci
      - name: Install Playwright browsers
        if: always()
        run: cd frontend && npx playwright install chromium --with-deps
      - name: Run E2E tests
        run: cd frontend && npx playwright test
      # 失败时把后端日志、前端截图与 trace 一起留下——没有这些，"CI 挂了"只能靠猜
      - name: Upload E2E diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics
          path: |
            backend-e2e.log
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: warn
