name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # 后端质量门禁：格式、确定性单元测试、规则回归与高优先级静态分析
  unit-test:
    name: Backend Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Verify formatting, tests and static analysis
        run: cd backend && ./mvnw verify -Dgroups='!integration'
      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco
          if-no-files-found: error

  # 敏感信息扫描：检查 API Key / 私钥 / 硬编码密钥是否意外提交
  security-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan for secrets
        run: |
          if grep -rInE \
            --exclude-dir=node_modules --exclude-dir=target --exclude-dir=.git \
            --exclude='*.lock' \
            "(sk-[A-Za-z0-9_-]{16,}|AKIA[0-9A-Z]{16}|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|api[_-]?key[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9_-]{16,})" \
            . ; then
            echo "::error::检测到疑似密钥/私钥泄露"
            exit 1
          fi
          echo "未检测到密钥/私钥泄露"

  # 前端：组件测试 + 类型检查 + 生产构建，避免提交破坏前端
  frontend-build:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Check formatting
        run: cd frontend && npm run format:check
      - name: Lint
        run: cd frontend && npm run lint
      - name: Run unit tests
        run: cd frontend && npm run test:coverage
      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage
          if-no-files-found: error
      - name: Audit production dependencies
        run: cd frontend && npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - name: Build
        run: cd frontend && npm run build

  backend-dependency-scan:
    name: Backend Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Scan Maven dependencies
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          args=(-DfailBuildOnCVSS=7)
          if [ -n "$NVD_API_KEY" ]; then
            args+=("-DnvdApiKey=$NVD_API_KEY")
          fi
          ./mvnw org.owasp:dependency-check-maven:12.2.2:check "${args[@]}"

  # 辅助 Python 脚本：与主工程使用相同的 LF、120 列和静态检查基线
  python-quality:
    name: Python Script Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Ruff
        run: pip install -r requirements-dev.txt
      - name: Check formatting
        run: ruff format --check benchmark scripts
      - name: Lint
        run: ruff check benchmark scripts
      - name: Run benchmark protocol tests
        run: python -m unittest discover -s benchmark -p 'test_*.py'
      - name: Check repository text conventions
        run: python scripts/check_text_conventions.py

  # 集成测试：每次变更都在隔离依赖服务上执行，防止迁移和适配器回归漏检
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123456
          MYSQL_DATABASE: aml_agent
          MYSQL_USER: aml
          MYSQL_PASSWORD: aml123456
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot123456"
          --health-interval 10s --health-timeout 5s --health-retries 5
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aml
          POSTGRES_PASSWORD: aml123456
          POSTGRES_DB: aml_rag
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aml -d aml_rag"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run integration tests
        run: cd backend && ./mvnw -Pintegration-test test
        env:
          AML_RAG_RERANK_ENABLED: 'false'

  # 端到端测试：后端 + 前端 + Playwright，验证核心用户流程
  e2e-test:
    name: Playwright E2E
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123456
          MYSQL_DATABASE: aml_agent
          MYSQL_USER: aml
          MYSQL_PASSWORD: aml123456
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot123456"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aml
          POSTGRES_PASSWORD: aml123456
          POSTGRES_DB: aml_rag
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aml -d aml_rag"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start backend
        run: cd backend && ./mvnw spring-boot:run &
        env:
          SPRING_PROFILES_ACTIVE: test
          MYSQL_USER: aml
          MYSQL_PASSWORD: aml123456
          AML_RAG_RERANK_ENABLED: 'false'
      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "后端已就绪"
              exit 0
            fi
            sleep 2
          done
          echo "::error::后端未在超时时间内就绪"
          exit 1
      - name: Install frontend deps
        run: cd frontend && npm ci
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install chromium --with-deps
      - name: Run E2E tests
        run: cd frontend && npx playwright test
