name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # 确定性单元测试与规则回归：无需模型/网络，自动执行
  unit-test:
    name: Unit & Rule Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run unit tests
        run: cd backend && ./mvnw test -Dgroups='!integration'

  # 前端构建：类型检查 + 生产构建，避免提交破坏前端
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Build
        run: cd frontend && npm run build

  # 集成测试：需 Docker 依赖服务与本地 embedding 模型，手动触发避免默认 CI 失败
  integration-test:
    name: Integration Tests (manual)
    runs-on: ubuntu-latest
    needs: unit-test
    if: github.event_name == 'workflow_dispatch'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123456
          MYSQL_DATABASE: aml_agent
          MYSQL_USER: aml
          MYSQL_PASSWORD: aml123456
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot123456"
          --health-interval 10s --health-timeout 5s --health-retries 5
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aml
          POSTGRES_PASSWORD: aml123456
          POSTGRES_DB: aml_rag
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aml -d aml_rag"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run integration tests
        run: cd backend && ./mvnw test -Dgroups=integration
