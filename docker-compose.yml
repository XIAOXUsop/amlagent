services:
  mysql:
    image: mysql:8.0
    container_name: aml-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aml_agent}
      MYSQL_USER: ${MYSQL_USER:-aml}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aml123456}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      # 本机已占用 3306，Docker MySQL 映射到 3307
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: aml-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-aml}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-aml123456}
      POSTGRES_DB: aml_rag
      TZ: Asia/Shanghai
    ports:
      # 本机已占用 5432，Docker PGVector 映射到 5433
      - "5433:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aml -d aml_rag"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: aml-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    # 国内网络使用镜像加速前缀，如拉取失败可改回 prom/prometheus
    image: docker.m.daocloud.io/prom/prometheus:latest
    container_name: aml-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: docker.m.daocloud.io/grafana/grafana:latest
    container_name: aml-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  mysql-data:
  pgvector-data:
  redis-data:
