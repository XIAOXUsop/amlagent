# 生产环境配置：Hibernate 校验 + Flyway 迁移 + Secure Cookie
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

aml:
  assistant:
    # 生产必须经安全评测后显式开启，默认保持关闭。
    enabled: ${AML_ASSISTANT_ENABLED:false}
  rag:
    fail-fast-on-empty-index: true
  demo:
    seed-customers: false
  security:
    cookie-secure: true

# 生产默认关闭 Swagger / OpenAPI（避免暴露接口清单）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
