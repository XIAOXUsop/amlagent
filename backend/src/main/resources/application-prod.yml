# 生产环境配置：Hibernate 校验 + Flyway 迁移 + Secure Cookie
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

aml:
  security:
    cookie-secure: true

# 生产默认关闭 Swagger / OpenAPI（避免暴露接口清单）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
