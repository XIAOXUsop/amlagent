spring:
  application:
    name: aml-agent-backend
  datasource:
    url: jdbc:mysql://localhost:3307/aml_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:aml}
    password: ${MYSQL_PASSWORD:aml123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 3000
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 20
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
  flyway:
    # 开发默认禁用（用 ddl-auto=update）；生产环境设 FLYWAY_ENABLED=true 并 ddl-auto=validate
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 3s

server:
  port: 8080
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: 200
      min-spare: 20
    max-connections: 10000
    accept-count: 200
    connection-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: aml-agent

logging:
  level:
    com.bank.aml: INFO
    dev.langchain4j: INFO
  # 在日志中加入 traceId（由 TraceIdFilter 写入 MDC），便于按一次请求/工单聚合关联排查
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-}] %logger{36} - %msg%n"

# ---- AML 专有配置 ----
aml:
  security:
    # JWT 签名密钥（生产环境应改为环境变量注入）
    jwt-secret: ${AML_JWT_SECRET:aml-agent-jwt-secret-2026-change-me-0123456789abcdef}
    jwt-validity-hours: 24
    # 登录失败速率限制（按 IP+用户名；窗口内失败超限锁定一段时间，缓解暴力破解）
    login:
      max-attempts: 5
      window-seconds: 60
      lock-seconds: 300

  # 可靠任务队列（Redis Streams）
  queue:
    stream: aml:workflow:cases
    dead-stream: aml:workflow:dead
    group: aml-workers
    consumer: worker-1
    max-retry: 3
    claim-idle-seconds: 60
    outbox-poll-seconds: 5
    retry-backoff-seconds: 5   # 指数退避基数（5s、15s、45s）
    retry-poll-seconds: 5
    # 消费者连接恢复与健康监控（Docker 重启等中断后自动重建消费者容器）
    health-probe-seconds: 10    # 健康探测间隔（秒）
    lag-alert-threshold: 20     # 积压告警阈值（0 禁用）
    lag-recover-threshold: 50   # 积压强制重建阈值（应 > lag-alert-threshold）
    consecutive-error-alert-threshold: 3  # 连续异常告警抑制阈值

  # 多 LLM 提供商：切换 aml.llm.active-provider 即可换模型。
  # 未配置 API Key 时自动降级到 Mock 模型（可离线演示完整链路）。
  llm:
    active-provider: deepseek
    providers:
      deepseek:
        type: openai-compatible
        base-url: https://api.deepseek.com
        # 真实 Key 仅通过环境变量注入；未配置时自动降级 Mock
        api-key: ${DEEPSEEK_API_KEY:}
        model-name: deepseek-v4-flash
      openai:
        type: openai-compatible
        base-url: https://api.openai.com/v1
        api-key: ${OPENAI_API_KEY:}
        model-name: gpt-4o-mini
      qwen:
        type: openai-compatible
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ${DASHSCOPE_API_KEY:}
        model-name: qwen-plus
      claude:
        type: anthropic
        api-key: ${ANTHROPIC_API_KEY:}
        model-name: claude-sonnet-4-6
      mock:
        type: mock
        model-name: mock-demo

  # RAG 向量库（PostgreSQL + pgvector），独立于 MySQL 业务库
  rag:
    cache-ttl-minutes: 60   # 检索结果缓存 TTL（分钟）
    rerank:
      enabled: true         # 召回后精排（bge-reranker 本地 cross-encoder）
      recall-size: 20       # 召回候选数
      model-dir: ${user.home}/.cache/aml-reranker/bge-reranker-base
    pg:
      url: jdbc:postgresql://localhost:5433/aml_rag
      username: ${PG_USER:aml}
      password: ${PG_PASSWORD:aml123456}
      table: legal_docs
      dimensions: 384   # all-MiniLM-L6-v2 输出维度
    data-dir: ./data/legal

  # 成本路由：默认关闭规则兜底（不影响真实模型评测）；开启后 SIMPLE 工单零 LLM 成本
  cost-routing:
    rule-fallback-enabled: false
    summary-enabled: false   # 流式摘要默认关闭（避免第二次模型调用）


# OpenAPI 文档元信息
springdoc:
  info:
    title: AML Agent 尽调平台 API
    description: 商业银行反洗钱尽调 Agent 平台接口文档
    version: 0.1.0